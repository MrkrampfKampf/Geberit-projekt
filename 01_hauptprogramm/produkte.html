<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produkte - GeberitProdukte</title>
    <style>
        :root {
            --geberit-blue: #3f6f8f;
            --geberit-dark: #2f3f47;
            --geberit-text: #23343b;
            --geberit-border: #b8c3ca;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f7f9fb 0%, #eef4f7 100%);
            color: var(--geberit-text);
        }

        nav {
            position: sticky;
            top: 0;
            background: #fff;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 4px 14px rgba(47, 63, 71, 0.10);
        }

        .logo {
            margin-right: auto;
        }

        .logo img {
            height: 25px;
            transition: transform 0.3s ease;
        }

        .logo img:hover {
            transform: scale(1.1);
        }

        .logo a.logo-clicked img {
            filter: drop-shadow(0 0 10px rgba(79, 195, 247, 0.85));
            transform: scale(1.14);
        }

        nav > a {
            position: relative;
            color: #111;
            text-decoration: none;
            font-weight: 500;
            margin-left: 28px;
            padding: 0.25rem 0;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        nav > a::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: -6px;
            height: 2px;
            border-radius: 999px;
            background: #111;
            transform: scaleX(0);
            transform-origin: center;
            transition: transform 0.3s ease;
        }

        nav > a:hover,
        nav > a.active {
            color: #000;
            transform: translateY(-1px);
        }

        nav > a:hover::after,
        nav > a.active::after {
            transform: scaleX(1);
        }

        .cart-nav-link {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
        }

        .cart-nav-count {
            display: none;
            align-items: center;
            justify-content: center;
            min-width: 1.35rem;
            height: 1.35rem;
            border-radius: 999px;
            padding: 0 0.35rem;
            background: var(--geberit-blue);
            color: #fff;
            font-size: 0.78rem;
            font-weight: 900;
        }

        .cart-nav-link.has-items .cart-nav-count {
            display: inline-flex;
        }

        .nav-search {
            position: relative;
            margin-left: 28px;
        }

        .nav-search-input {
            width: 170px;
            border: 1px solid #d5dde2;
            border-radius: 999px;
            padding: 0.4rem 0.8rem;
            font: inherit;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .nav-search-input:focus {
            border-color: #111;
            box-shadow: 0 0 0 3px rgba(17, 17, 17, 0.08);
        }

        .nav-search-results {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            width: min(280px, 80vw);
            display: none;
            background: #fff;
            border: 1px solid #dce5eb;
            border-radius: 14px;
            box-shadow: 0 18px 35px rgba(47, 63, 71, 0.18);
            overflow: hidden;
            z-index: 1200;
        }

        .nav-search-results.active {
            display: block;
        }

        .nav-search-result {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            padding: 0.65rem 0.8rem;
            color: #111;
            text-decoration: none;
            font-size: 0.88rem;
            line-height: 1.3;
        }

        .nav-search-result:hover {
            background: #f2f5f7;
        }

        .nav-search-result small {
            display: block;
            color: #66737a;
            margin-top: 0.15rem;
        }

        .nav-search-thumb {
            width: 44px;
            height: 44px;
            flex: 0 0 44px;
            object-fit: cover;
            border: 1px solid #dce5eb;
            border-radius: 10px;
            background: #eef4f7;
        }

        .cart-toggle {
            margin-left: 16px;
            border: 1px solid #c3d5e0;
            border-radius: 999px;
            background: #e8f0f5;
            color: var(--geberit-blue);
            padding: 0.42rem 0.75rem;
            cursor: pointer;
            font: inherit;
            font-weight: 800;
        }

        .secret-bomb {
            position: fixed;
            left: 50%;
            top: 50%;
            width: 96px;
            height: 96px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at 35% 30%, #59646b 0 12%, #1e2529 44%, #07090a 100%);
            color: white;
            font-size: 2.8rem;
            text-decoration: none;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75), 0 0 42px rgba(255, 42, 66, 0.45);
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0.78);
            transition: opacity 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
            z-index: 3001;
        }

        .secret-bomb.active {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
            animation: secretBombFloat 2.6s ease-in-out infinite;
        }

        .secret-bomb-backdrop {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 50% 50%, rgba(255, 42, 66, 0.16), transparent 18%),
                radial-gradient(circle at 50% 50%, transparent 0 18%, rgba(0, 0, 0, 0.92) 48%),
                rgba(0, 0, 0, 0.9);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            z-index: 3000;
        }

        .secret-bomb-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        @keyframes secretBombFloat {
            0%, 100% {
                translate: 0 0;
            }
            50% {
                translate: 0 -12px;
            }
        }

        main {
            max-width: 1200px;
            margin: 0 auto 1.6rem;
            padding: 1rem;
        }

        .hero {
            margin-bottom: 0.9rem;
        }

        .hero-badge {
            display: none;
            background-color: #e8f0f5;
            color: var(--geberit-blue);
            padding: 0.28rem 0.6rem;
            border: 1px solid #c3d5e0;
            border-radius: 999px;
            font-size: 0.8rem;
            margin-bottom: 0.55rem;
        }

        .hero h1 {
            display: none;
            margin: 0 0 0.35rem;
            font-size: 1.6rem;
            color: var(--geberit-dark);
            letter-spacing: 0;
        }

        .hero p {
            display: none;
            margin: 0;
            color: #5e6a70;
        }

        .search-panel {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            margin: 0;
            padding: 0;
            background: transparent;
            border: 0;
            border-radius: 0;
            box-shadow: none;
        }

        .search-panel label {
            color: var(--geberit-dark);
            font-weight: 700;
            white-space: nowrap;
        }

        .search-panel input {
            width: 100%;
            border: 1px solid #c5d1d8;
            border-radius: 10px;
            padding: 0.7rem 0.85rem;
            color: var(--geberit-text);
            font: inherit;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .search-panel input:focus {
            border-color: #4fc3f7;
            box-shadow: 0 0 0 4px rgba(79, 195, 247, 0.18);
        }

        .category-section {
            background: transparent;
            border: 0;
            border-radius: 0;
            padding: 0;
            box-shadow: none;
        }

        .category-title {
            display: block;
            margin: 0 0 1rem;
            color: var(--geberit-dark);
            font-size: 1.35rem;
            text-align: center;
        }

        .category-buttons {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .category-button {
            border: 1px solid #c3d5e0;
            border-radius: 10px;
            background: #e8f0f5;
            color: var(--geberit-blue);
            padding: 0.8rem 1rem;
            cursor: pointer;
            font: inherit;
            font-weight: 800;
            box-shadow: 0 6px 14px rgba(47, 63, 71, 0.06);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease, color 0.2s ease;
        }

        .category-button:hover,
        .category-button.active {
            background: linear-gradient(90deg, #3f6f8f 0%, #2f3f47 100%);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(47, 63, 71, 0.14), 0 0 18px rgba(79, 195, 247, 0.18);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            animation: fadeIn 0.35s ease-out;
        }

        .product-card {
            display: flex;
            flex-direction: column;
            height: 100%;
            border: 1px solid var(--geberit-border);
            border-radius: 14px;
            padding: 0;
            background-color: #fff;
            text-align: left;
            width: 100%;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(47, 63, 71, 0.07);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            appearance: none;
            -webkit-appearance: none;
            position: relative;
        }

        .recommendation-badge {
            position: absolute;
            top: 0.75rem;
            left: 0.75rem;
            z-index: 2;
            border-radius: 999px;
            background: linear-gradient(90deg, #3f6f8f 0%, #2f3f47 100%);
            color: #fff;
            padding: 0.3rem 0.65rem;
            font-size: 0.78rem;
            font-weight: 800;
            box-shadow: 0 8px 16px rgba(47, 63, 71, 0.2);
        }

        .product-card:hover {
            transform: translateY(-4px);
            border-color: rgba(79, 195, 247, 0.7);
            box-shadow: 0 14px 28px rgba(47, 63, 71, 0.13), 0 0 20px rgba(79, 195, 247, 0.18);
            background-color: #f8fbfd;
        }

        .product-image {
            width: 100%;
            height: 190px;
            object-fit: cover;
            background-color: #ece7df;
            display: block;
        }

        .product-info {
            display: flex;
            flex: 1;
            flex-direction: column;
            padding: 0.9rem;
        }

        .product-card h3 {
            min-height: 3rem;
            margin: 0 0 0.45rem;
            color: var(--geberit-dark);
            font-size: 1rem;
        }

        .product-card p {
            color: #5f6b70;
            margin: 0.2rem 0;
            font-size: 0.9rem;
        }

        .material-tag {
            display: inline-block;
            background-color: #e8f0f5;
            color: var(--geberit-blue);
            border: 1px solid #c3d5e0;
            border-radius: 999px;
            padding: 0.24rem 0.55rem;
            font-size: 0.8rem;
            font-weight: 700;
            margin: 0.15rem 0 0.55rem;
        }

        .price {
            font-weight: bold;
            color: var(--geberit-blue);
            margin-top: 0.5rem;
        }

        .product-actions {
            margin-top: auto;
            padding-top: 0.8rem;
        }

        .cart-add-button,
        .modal-cart-button,
        .cart-action-button {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.55rem;
            border: 0;
            border-radius: 999px;
            background: linear-gradient(90deg, #3f6f8f 0%, #2f3f47 100%);
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-weight: 800;
            padding: 0.58rem 0.85rem;
            box-shadow: 0 8px 18px rgba(47, 63, 71, 0.18);
            transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
            overflow: hidden;
        }

        .cart-add-button::after,
        .modal-cart-button::after {
            content: ">";
            font-weight: 900;
            transform: translateX(0);
            transition: transform 0.18s ease;
        }

        .cart-add-button:hover,
        .modal-cart-button:hover,
        .cart-action-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(47, 63, 71, 0.24), 0 0 0 4px rgba(79, 195, 247, 0.14);
            filter: brightness(1.04);
        }

        .cart-add-button:hover::after,
        .modal-cart-button:hover::after {
            transform: translateX(4px);
        }

        .cart-add-button:active,
        .modal-cart-button:active,
        .cart-action-button:active {
            transform: translateY(0) scale(0.98);
        }

        .cart-add-button.added,
        .modal-cart-button.added {
            background: linear-gradient(90deg, #2f7d55 0%, #245f41 100%);
        }

        .cart-add-button.added::after,
        .modal-cart-button.added::after {
            content: "OK";
            transform: none;
        }

        .cart-add-button {
            width: 100%;
        }

        .cart-toast {
            position: fixed;
            top: 82px;
            right: 20px;
            z-index: 2300;
            display: grid;
            gap: 0.15rem;
            width: min(340px, calc(100vw - 32px));
            border: 1px solid #bed5c8;
            border-radius: 12px;
            padding: 0.9rem 1rem;
            background: #f4fbf7;
            color: var(--geberit-dark);
            box-shadow: 0 14px 32px rgba(47, 63, 71, 0.18);
            animation: toastIn 0.24s ease;
        }

        .cart-toast strong {
            font-size: 0.95rem;
        }

        .cart-toast span {
            color: #5f6b70;
            font-size: 0.86rem;
        }

        .cart-toast.hide {
            animation: toastOut 0.24s ease forwards;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes toastOut {
            from {
                opacity: 1;
                transform: translateY(0);
            }
            to {
                opacity: 0;
                transform: translateY(-8px);
            }
        }

        .empty-state {
            display: none;
            margin: 1rem 0 0;
            padding: 1rem;
            border: 1px solid #c9d4db;
            border-radius: 14px;
            background: #fff;
            color: #5e6a70;
            box-shadow: 0 8px 20px rgba(47, 63, 71, 0.06);
        }

        .empty-state.active {
            display: block;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.62);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            z-index: 2000;
        }

        .modal-backdrop.active {
            display: flex;
        }

        .modal {
            background: #fff;
            border: 1px solid #c2cfd6;
            border-radius: 16px;
            width: min(100%, 760px);
            max-height: 90vh;
            overflow-y: auto;
            padding: 1rem;
            position: relative;
            box-shadow: 0 16px 40px rgba(47, 63, 71, 0.16);
        }

        .modal-content {
            display: grid;
            grid-template-columns: minmax(230px, 320px) 1fr;
            gap: 1rem;
            align-items: start;
        }

        .modal-image {
            width: 100%;
            height: 260px;
            object-fit: cover;
            border: 1px solid #dce5eb;
            background-color: #f1f5f7;
            border-radius: 10px;
        }

        .modal-close {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            border: none;
            background: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--geberit-dark);
        }

        .modal h3 {
            margin: 0 0 0.55rem;
            color: var(--geberit-dark);
            font-size: 1.2rem;
            padding-right: 1.8rem;
        }

        .modal p {
            margin: 0.25rem 0 0;
            color: #53656d;
        }

        .modal .meta {
            margin-top: 0.9rem;
            font-weight: bold;
            color: var(--geberit-blue);
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .modal-cart-button {
            margin-top: 1rem;
        }

        .cart-backdrop {
            position: fixed;
            inset: 0;
            display: none;
            background: rgba(0, 0, 0, 0.36);
            z-index: 2100;
        }

        .cart-backdrop.active {
            display: block;
        }

        .cart-panel {
            position: fixed;
            top: 0;
            right: 0;
            width: min(420px, 100vw);
            height: 100vh;
            background: #fff;
            border-left: 1px solid var(--geberit-border);
            box-shadow: -14px 0 36px rgba(47, 63, 71, 0.18);
            z-index: 2200;
            transform: translateX(100%);
            transition: transform 0.22s ease;
            display: flex;
            flex-direction: column;
        }

        .cart-panel.active {
            transform: translateX(0);
        }

        .cart-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem;
            border-bottom: 1px solid #e3ebef;
        }

        .cart-header h2 {
            margin: 0;
            color: var(--geberit-dark);
            font-size: 1.1rem;
        }

        .cart-close {
            border: 0;
            background: transparent;
            cursor: pointer;
            font-size: 1.5rem;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 0.75rem 1rem;
        }

        .cart-item {
            display: grid;
            grid-template-columns: 64px 1fr auto;
            gap: 0.7rem;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid #e8eff3;
        }

        .cart-item img {
            width: 64px;
            height: 52px;
            object-fit: cover;
            border-radius: 8px;
            background: #eef3f6;
        }

        .cart-item strong {
            display: block;
            color: var(--geberit-dark);
            font-size: 0.92rem;
        }

        .cart-item small,
        .cart-note,
        .cart-empty {
            color: #66737a;
        }

        .cart-quantity {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            margin-top: 0.45rem;
        }

        .cart-quantity button,
        .cart-remove {
            border: 1px solid #c3d5e0;
            background: #f3f8fa;
            border-radius: 8px;
            cursor: pointer;
            min-width: 30px;
            height: 30px;
        }

        .cart-remove {
            color: #8a1f1f;
        }

        .cart-empty {
            padding: 1rem 0;
        }

        .cart-footer {
            border-top: 1px solid #e3ebef;
            padding: 1rem;
            display: grid;
            gap: 0.75rem;
        }

        .discount-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 0.5rem;
        }

        .discount-row input {
            border: 1px solid #c3d5e0;
            border-radius: 10px;
            padding: 0.58rem 0.7rem;
            font: inherit;
        }

        .cart-summary {
            color: var(--geberit-dark);
            font-weight: 800;
        }

        .cart-note {
            font-size: 0.82rem;
            margin: 0;
        }

        footer {
            background: linear-gradient(90deg, #ffffff 0%, #ffffff 100%);
            color: #000000;
            text-align: center;
            padding: 1rem;
            margin-top: 1.5rem;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 700px) {
            nav {
                flex-wrap: wrap;
                justify-content: flex-end;
            }

            .logo {
                width: 100%;
                margin-right: 0;
                text-align: left;
            }

            .modal-content {
                grid-template-columns: 1fr;
            }

            .modal-image {
                height: 210px;
            }

            .search-panel {
                align-items: stretch;
                flex-direction: column;
            }

        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">
            <a href="Grundseite.html#home">
                <img src="../02_images/geberit-logo.png" alt="Geberit Logo">
            </a>
        </div>
        <a href="Grundseite.html">Home</a>
        <a href="Über-Uns.html">Über Geberit</a>
        <a href="produkte.html" class="active">Produkte</a>
        <a href="warenkorb.html" class="cart-nav-link" id="cartNavLink" aria-label="Einkaufswagen"><span class="cart-nav-icon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M3 5h4l3.2 16h15.2l2.2-11.2H8.2"></path><path d="M10 10h17"></path><path d="M11.1 15.5h15.1"></path><path d="M12.2 21h13.2"></path><path d="M13 10l1.2 11"></path><path d="M19 10v11"></path><path d="M25 10l-1.2 11"></path><circle cx="13" cy="26" r="2"></circle><circle cx="24" cy="26" r="2"></circle></svg></span><span class="cart-nav-count" id="cartNavCount">0</span></a>
        <a href="Grundseite.html#contact">Kontakt</a>
        <div class="nav-search" role="search">
            <input class="nav-search-input" type="search" placeholder="Suchen" aria-label="Produkte suchen" autocomplete="off">
            <div class="nav-search-results" aria-label="Suchvorschläge"></div>
        </div>
    </nav>

    <a class="secret-bomb" id="secretBomb" href="../03_DummesZeug/Tictactoe.html" aria-hidden="true" aria-label="Tic Tac Toe öffnen">💣</a>
    <div class="secret-bomb-backdrop" id="secretBombBackdrop" aria-hidden="true"></div>

    <main>
        <section class="hero">
            <p>Alle Produktdaten aus beiden Produktseiten sind in einer Übersicht zusammengeführt.</p>
            <div class="search-panel">
                <label for="productSearch">Suche</label>
                <input type="search" id="productSearch" placeholder="Produkt suchen..." autocomplete="off">
            </div>
        </section>

        <section class="category-section" id="services">
            <h2 class="category-title" id="categoryTitle">Alle Produkte</h2>
            <div class="category-buttons" id="categoryButtons"></div>
            <p class="empty-state" id="emptyState">Kein Produkt passt zu deiner Suche.</p>
            <div class="products-grid" id="productsContainer"></div>
        </section>

        const placeholderImage = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 400 300%22%3E%3Crect fill=%22%23ddd%22 width=%22400%22 height=%22300%22/%3E%3Ctext x=%22200%22 y=%22150%22 font-size=%2235%22 fill=%22%23999%22 text-anchor=%22middle%22 font-family=%22Arial%22 dy=%22.3em%22%3E%5BBild%5D%3C/text%3E%3C/svg%3E';
        const visitorStorageKey = 'geberitVisitorId';
        const recommendationsStorageKey = 'geberitRecentProducts';
        const cartStorageKey = 'geberitCartItems';
        let activeCategoryId = 'all';
        let selectedModalProduct = null;

        function mergeProducts(primaryProducts = [], fallbackProducts = []) {
            const productsByName = new Map();
            [...fallbackProducts, ...primaryProducts].forEach(product => {
                if (product?.name) {
                    productsByName.set(product.name.toLowerCase(), product);
                }
            });
            return Array.from(productsByName.values());
        }

        function buildCategories(productGroups = {}) {
            const localGroups = {
                waschbecken: datenbank.waschbecken,
                wc: [...originalProducts, ...datenbank.wc],
                dusche: datenbank.dusche
            };

            categories = [
                { id: 'all', label: 'Alle Produkte', products: [] },
                { id: 'waschbecken', label: 'Waschbecken', products: mergeProducts(productGroups.waschbecken, localGroups.waschbecken) },
                { id: 'wc', label: 'WC-Systeme', products: mergeProducts(productGroups.wc, localGroups.wc) },
                { id: 'dusche', label: 'Duschen & Abläufe', products: mergeProducts(productGroups.dusche, localGroups.dusche) }
            ];
            categories[0].products = categories.slice(1).flatMap(category => category.products);
            navSearchProducts = categories.slice(1).flatMap(category => {
                return category.products.map(product => ({
                    name: product.name,
                    category: category.label,
                    image: product.image || product.bild || placeholderImage
                }));
            });
        }

        function getCategoryLabel(categoryId) {
            return categories.find(category => category.id === categoryId)?.label || '';
        }

        function getProductImage(product) {
            return product.image || product.bild || placeholderImage;
        }

        function getProductPrice(product) {
            return product.price || product.preis || '';
        }

        function getProductDescription(product) {
            return product.description || product.material || '';
        }

        function getProductArticle(product) {
            return product.articleNumber || '';
        }

        function getCartItems() {
            try {
                return JSON.parse(localStorage.getItem(cartStorageKey)) || [];
            } catch (error) {
                return [];
            }
        }

        function setCartItems(items) {
            localStorage.setItem(cartStorageKey, JSON.stringify(items));
        }

        function getCartItemCount() {
            return getCartItems().reduce((sum, item) => sum + (item.quantity || 0), 0);
        }

        function updateCartNavCount() {
            const count = getCartItemCount();
            const cartNavLink = document.getElementById('cartNavLink') || dom.cartNavLink;
            const cartNavCount = document.getElementById('cartNavCount') || dom.cartNavCount;
            if (cartNavLink && cartNavCount) {
                cartNavCount.textContent = count;
                cartNavLink.classList.toggle('has-items', count > 0);
            }
            if (window.updateCartNavigation) {
                window.updateCartNavigation();
            }
        }

        function showCartToast(productName) {
            const existingToast = document.querySelector('.cart-toast');
            if (existingToast) existingToast.remove();

            const toast = document.createElement('div');
            toast.className = 'cart-toast';
            toast.innerHTML = `<strong>Im Einkaufswagen</strong><span>${productName} wurde hinzugefuegt.</span>`;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('hide');
                setTimeout(() => toast.remove(), 260);
            }, 2200);
        }

        function showButtonAdded(button) {
            if (!button) return;
            const originalText = button.textContent;
            button.classList.add('added');
            button.textContent = 'Hinzugefuegt';
            setTimeout(() => {
                button.classList.remove('added');
                button.textContent = originalText;
            }, 1100);
        }

        function getProductSearchText(product, categoryId) {
            return [
                product.name,
                product.description,
                product.price,
                product.articleNumber,
                product.preis,
                product.material,
                product.bild,
                product.image,
                getCategoryLabel(categoryId)
            ].filter(Boolean).join(' ').toLowerCase();
        }

        function findProductByName(productName) {
            const normalizedProductName = productName.trim().toLowerCase();
            return categories[0].products.find(product => product.name.toLowerCase() === normalizedProductName)
                || categories[0].products.find(product => product.name.toLowerCase().includes(normalizedProductName));
        }

        function getVisitorId() {
            let visitorId = localStorage.getItem(visitorStorageKey);
            if (!visitorId) {
                visitorId = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
                localStorage.setItem(visitorStorageKey, visitorId);
            }
            return visitorId;
        }

        function getProductCategoryId(product) {
            const category = categories.slice(1).find(item => item.products.some(entry => entry.name === product.name));
            return category?.id || product.category || '';
        }

        function getProductCategoryLabel(product) {
            const category = categories.slice(1).find(item => item.products.some(entry => entry.name === product.name));
            return category?.label || product.category || '';
        }

        function getRecentProducts() {
            try {
                return JSON.parse(localStorage.getItem(recommendationsStorageKey)) || [];
            } catch (error) {
                return [];
            }
        }

        function saveRecentProduct(product) {
            const item = {
                name: product.name,
                category: getProductCategoryLabel(product),
                image: getProductImage(product),
                price: getProductPrice(product)
            };
            const recentProducts = getRecentProducts().filter(entry => entry.name !== item.name);
            recentProducts.unshift(item);
            localStorage.setItem(recommendationsStorageKey, JSON.stringify(recentProducts.slice(0, 3)));
        }

        function isRecommendedProduct(product) {
            return getRecentProducts()
                .slice(0, 3)
                .some(entry => entry.name === product.name);
        }

        function sortRecommendedProducts(products) {
            const recentProductNames = getRecentProducts().slice(0, 3).map(product => product.name);
            if (recentProductNames.length === 0) {
                return products;
            }

            return [...products].sort((firstProduct, secondProduct) => {
                const firstIndex = recentProductNames.indexOf(firstProduct.name);
                const secondIndex = recentProductNames.indexOf(secondProduct.name);

                if (firstIndex === -1 && secondIndex === -1) return 0;
                if (firstIndex === -1) return 1;
                if (secondIndex === -1) return -1;
                return firstIndex - secondIndex;
            });
        }

        function saveProductClick(product) {
            GeberitDatabase.saveProductClick({
                visitor_id: getVisitorId(),
                product_name: product.name,
                category: getProductCategoryId(product),
                page_path: window.location.pathname,
                user_agent: navigator.userAgent
            }).catch(error => {
                console.warn('Produktklick konnte nicht in Supabase gespeichert werden.', error);
            });
        }

        function addToCart(product) {
            const item = {
                name: product.name,
                category: getProductCategoryLabel(product),
                price: getProductPrice(product),
                image: getProductImage(product),
                quantity: 1
            };
            const items = getCartItems();
            const existingItem = items.find(entry => entry.name === item.name);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                items.unshift(item);
            }
            setCartItems(items);
            updateCartNavCount();
            showCartToast(item.name);

            GeberitDatabase.saveCartItem({
                visitor_id: getVisitorId(),
                product_name: item.name,
                category: item.category,
                price: item.price,
                image_url: item.image,
                quantity: existingItem ? existingItem.quantity : item.quantity,
                discount_code: localStorage.getItem('geberitDiscountCode') || null
            }).catch(error => {
                console.warn('Warenkorb konnte nicht in Supabase gespeichert werden.', error);
            });
        }

        function createCategoryButtons() {
            dom.categoryButtons.innerHTML = '';

            categories.forEach(category => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'category-button';
                button.id = `btn-${category.id}`;
                button.textContent = `${category.label} (${category.products.length})`;
                button.addEventListener('click', () => {
                    activeCategoryId = category.id;
                    renderProducts();
                });
                dom.categoryButtons.appendChild(button);
            });
        }

        function createProductCard(product) {
            const card = document.createElement('article');
            card.className = 'product-card';
            card.tabIndex = 0;
            card.innerHTML = `
                ${isRecommendedProduct(product) ? '<span class="recommendation-badge">Empfohlen</span>' : ''}
                <img src="${getProductImage(product)}" alt="${product.name}" class="product-image">
                <div class="product-info">
                    <h3>${product.name}</h3>
                    ${product.material ? `<span class="material-tag">${product.material}</span>` : ''}
                    <p>${getProductDescription(product)}</p>
                    <p class="price">${getProductPrice(product)}</p>
                    <div class="product-actions">
                        <button class="cart-add-button" type="button">In den Einkaufswagen</button>
                    </div>
                </div>
            `;
            card.addEventListener('click', event => {
                const cartButton = event.target.closest('.cart-add-button');
                if (cartButton) {
                    addToCart(product);
                    showButtonAdded(cartButton);
                    return;
                }
                openModal(product);
            });
            card.addEventListener('keydown', event => {
                if (event.key === 'Enter') {
                    openModal(product);
                }
            });
            return card;
        }

        function renderProducts() {
            const activeCategory = categories.find(category => category.id === activeCategoryId) || categories[0];
            const searchTerm = dom.searchInput.value.trim().toLowerCase();
            const visibleProducts = activeCategory.products.filter(product => {
                return !searchTerm || getProductSearchText(product, activeCategory.id).includes(searchTerm);
            });
            const sortedProducts = sortRecommendedProducts(visibleProducts);

            document.querySelectorAll('.category-button').forEach(button => button.classList.remove('active'));
            document.getElementById(`btn-${activeCategory.id}`)?.classList.add('active');
            dom.categoryTitle.textContent = activeCategory.label;
            dom.container.innerHTML = '';
            sortedProducts.forEach(product => dom.container.appendChild(createProductCard(product)));
            dom.emptyState.classList.toggle('active', sortedProducts.length === 0);
        }

        function renderNavSearchResults() {
            const searchTerm = dom.navSearchInput.value.trim().toLowerCase();
            const matches = navSearchProducts
                .filter(product => product.name.toLowerCase().includes(searchTerm) || product.category.toLowerCase().includes(searchTerm))
                .slice(0, 5);

            if (searchTerm.length < 2 || matches.length === 0) {
                dom.navSearchResults.classList.remove('active');
                dom.navSearchResults.innerHTML = '';
                return;
            }

            dom.navSearchResults.innerHTML = matches.map(product => `
                <a class="nav-search-result" href="produkte.html?produkt=${encodeURIComponent(product.name)}#services">
                    <img class="nav-search-thumb" src="${product.image}" alt="">
                    <span>
                        ${product.name}
                        <small>${product.category}</small>
                    </span>
                </a>
            `).join('');
            dom.navSearchResults.classList.add('active');
        }

        function openModal(product) {
            selectedModalProduct = product;
            saveRecentProduct(product);
            saveProductClick(product);
            dom.modalTitle.textContent = product.name;
            dom.modalDescription.textContent = getProductDescription(product);
            dom.modalPrice.textContent = `Preis: ${getProductPrice(product) || 'nicht angegeben'}`;
            dom.modalArticle.textContent = getProductArticle(product)
                ? `Artikelnummer: ${getProductArticle(product)}`
                : '';
            dom.modalArticle.style.display = getProductArticle(product) ? '' : 'none';
            dom.modalImage.src = getProductImage(product);
            dom.modalImage.alt = product.name;
            dom.modal.classList.add('active');
            dom.modal.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            dom.modal.classList.remove('active');
            dom.modal.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';

            const params = new URLSearchParams(window.location.search);
            if (params.has('produkt')) {
                params.delete('produkt');
                const nextUrl = params.toString()
                    ? `${window.location.pathname}?${params.toString()}${window.location.hash}`
                    : `${window.location.pathname}${window.location.hash}`;
                window.history.replaceState({}, '', nextUrl);
            }
        }

        function handleBackdropClick(event) {
            if (event.target === dom.modal) {
                closeModal();
            }
        }

        async function initializeProducts() {
            try {
                const databaseProducts = await GeberitDatabase.loadProducts();
                if (databaseProducts && Object.keys(databaseProducts).length > 0) {
                    buildCategories(databaseProducts);
                }
            } catch (error) {
                console.warn('SQL-Produkte konnten nicht geladen werden. Lokale Produktdaten werden benutzt.', error);
            }

            createCategoryButtons();
            const params = new URLSearchParams(window.location.search);
            const initialProductName = params.get('produkt');
            const initialSearchTerm = params.get('suche');
            if (initialProductName || initialSearchTerm) {
                dom.searchInput.value = initialProductName || initialSearchTerm;
                activeCategoryId = 'all';
            }
            renderProducts();
            if (initialProductName) {
                const selectedProduct = findProductByName(initialProductName);
                if (selectedProduct) {
                    openModal(selectedProduct);
                }
            }
            dom.searchInput.addEventListener('input', renderProducts);
        }

        initializeProducts();
        updateCartNavCount();
        if (dom.navSearchInput && dom.navSearchResults) {
            dom.navSearchInput.addEventListener('input', renderNavSearchResults);
            dom.navSearchInput.addEventListener('focus', renderNavSearchResults);
            dom.navSearchInput.addEventListener('keydown', (event) => {
                if (event.key === 'Enter') {
                    if (dom.navSearchInput.value.trim().toLowerCase() === 'rr') {
                        window.location.href = 'https://www.youtube.com/watch?v=dQw4w9WgXcQ';
                        return;
                    }

                    const firstResult = dom.navSearchResults.querySelector('a');
                    if (firstResult) firstResult.click();
                }
            });
            dom.navSearchInput.addEventListener('blur', () => {
                setTimeout(() => dom.navSearchResults.classList.remove('active'), 160);
            });
        }
        dom.closeModalButton.addEventListener('click', closeModal);
        dom.modal.addEventListener('click', handleBackdropClick);
        dom.modalCartButton.addEventListener('click', () => {
            if (selectedModalProduct) {
                addToCart(selectedModalProduct);
                showButtonAdded(dom.modalCartButton);
            }
        });
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                closeModal();
            }
        });

        const logoLink = document.querySelector('.logo a');
        const secretBomb = document.getElementById('secretBomb');
        const secretBombBackdrop = document.getElementById('secretBombBackdrop');
        let logoClickCount = 0;
        let logoClickTimer;

        if (logoLink && secretBomb && secretBombBackdrop) {
            logoLink.addEventListener('click', (event) => {
                event.preventDefault();
                logoClickCount += 1;
                clearTimeout(logoClickTimer);

                logoLink.classList.add('logo-clicked');
                setTimeout(() => logoLink.classList.remove('logo-clicked'), 180);

                if (logoClickCount >= 3) {
                    secretBombBackdrop.classList.add('active');
                    secretBomb.classList.add('active');
                    secretBombBackdrop.setAttribute('aria-hidden', 'false');
                    secretBomb.setAttribute('aria-hidden', 'false');
                    logoClickCount = 0;
                    return;
                }

                logoClickTimer = setTimeout(() => {
                    logoClickCount = 0;
                    window.location.href = logoLink.href;
                }, 360);
            });
        }
    </script>
</body>
</html>
