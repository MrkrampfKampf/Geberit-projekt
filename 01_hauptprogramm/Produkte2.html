<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    scroll-behavior: smooth;
}

nav {
    position: sticky;
    top: 0;
    background: #fff;
    padding: 15px;
    display: flex;
    justify-content: flex-end;
    gap: 30px;
    z-index: 1000;
    box-shadow: 0 4px 14px rgba(47, 63, 71, 0.10);
}

nav a {
    color: #111;
    text-decoration: none;
    font-size: 18px;
    font-weight: 500;
    transition: 0.3s;
}

nav a:hover {
    color: #000;
    transform: scale(1.1);
}

#home {
    position: relative;
    height: 40vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: white;
}

#home::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: url("https://www.ahgz.de/news/media/26/Geberit-252934.jpeg");
    background-size: cover;
    background-position: center;
    filter: brightness(0.4);
}

#home div {
    position: relative;
    z-index: 2;
    animation: fadeIn 1.5s ease-in;
}

#home h1 {
    font-size: 3rem;
}

#home p {
    font-size: 1.2rem;
    margin-top: 10px;
}

@keyframes fadeIn {
    from {opacity:0; transform:translateY(20px);}
    to {opacity:1; transform:translateY(0);}
}

main {
    max-width: 1200px;
    margin: auto;
    background: white;
    padding: 40px;
}

section {
    margin-bottom: 60px;
}

h2 {
    text-align: center;
    margin-bottom: 30px;
    font-size: 2rem;
    color: #333;
}

.produkt-container {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 40px;
}

.kategorie-btn {
    background: #0054a6;
    color: white;
    padding: 15px 30px;
    border-radius: 5px;
    cursor: pointer;
    text-align: center;
    font-weight: bold;
    transition: 0.3s;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}

.kategorie-btn:hover, .kategorie-btn.active {
    background: #4fc3f7;
    color: #333;
    transform: translateY(-3px);
}

#produktAnzeige {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 25px;
    margin-top: 20px;
    animation: fadeIn 0.6s ease-out;
}

.produkt-karte {
    background: #ffffff;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    transition: transform 0.3s, box-shadow 0.3s;
}

.produkt-karte:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
}

.produkt-karte img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 6px;
    margin-bottom: 15px;
}

.produkt-karte h3 {
    font-size: 1.1rem;
    margin-bottom: 8px;
    color: #222;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.material-tag {
    display: inline-block;
    background: #e1f5fe;
    color: #0288d1;
    padding: 4px 10px;
    font-size: 0.85rem;
    border-radius: 20px;
    margin-bottom: 12px;
    font-weight: bold;
}

.preis-tag {
    font-size: 1.2rem;
    font-weight: bold;
    color: #0054a6;
}

footer {
    background: #ffffff;
    color: rgb(0, 0, 0);
    text-align: center;
    padding: 20px;
}
</style>

</main>

function zeigeKategorie(kategorie) {
    const anzeigeBereich = document.getElementById("produktAnzeige");
    anzeigeBereich.innerHTML = "";

    document.querySelectorAll('.kategorie-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById(`btn-${kategorie}`).classList.add('active');

    const produkte = datenbank[kategorie];

    if (produkte) {
        produkte.forEach(prod => {
            const karte = document.createElement("div");
            karte.className = "produkt-karte";
            
            karte.innerHTML = `
                <img src="${prod.bild}" alt="${prod.name}">
                <h3>${prod.name}</h3>
                <span class="material-tag">${prod.material}</span>
                <div class="preis-tag">${prod.preis}</div>
            `;
            
            anzeigeBereich.appendChild(karte);
        });
    }
}
