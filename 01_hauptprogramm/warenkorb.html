<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warenkorb - Geberit</title>
    <style>
        :root {
            --geberit-blue: #3f6f8f;
            --geberit-dark: #2f3f47;
            --geberit-text: #23343b;
            --geberit-border: #b8c3ca;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            background: linear-gradient(135deg, #f7f9fb 0%, #eef4f7 100%);
            color: var(--geberit-text);
        }

        nav {
            position: sticky;
            top: 0;
            background: #fff;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 4px 14px rgba(47, 63, 71, 0.10);
        }

        .logo {
            margin-right: auto;
        }

        .logo img {
            height: 25px;
        }

        nav > a {
            position: relative;
            color: #111;
            text-decoration: none;
            font-weight: 500;
            margin-left: 28px;
            padding: 0.25rem 0;
        }

        nav > a.active::after,
        nav > a:hover::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: -6px;
            height: 2px;
            border-radius: 999px;
            background: #111;
        }

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .page-head {
            margin-bottom: 1.25rem;
        }

        .page-head h1 {
            margin: 0;
            color: var(--geberit-dark);
            font-size: clamp(2rem, 5vw, 3.2rem);
        }

        .cart-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 340px;
            gap: 1rem;
            align-items: start;
        }

        .cart-list,
        .cart-summary-card {
            background: #fff;
            border: 1px solid var(--geberit-border);
            border-radius: 12px;
            box-shadow: 0 10px 24px rgba(47, 63, 71, 0.08);
        }

        .cart-list {
            overflow: hidden;
        }

        .cart-item {
            display: grid;
            grid-template-columns: 96px 1fr auto;
            gap: 1rem;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid #e4edf2;
        }

        .cart-item:last-child {
            border-bottom: 0;
        }

        .cart-item img {
            width: 96px;
            height: 76px;
            object-fit: cover;
            border-radius: 8px;
            background: #eef4f7;
        }

        .cart-item h2 {
            margin: 0;
            color: var(--geberit-dark);
            font-size: 1rem;
        }

        .cart-item p {
            margin: 0.2rem 0;
            color: #64737a;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            margin-top: 0.6rem;
        }

        button {
            font: inherit;
        }

        .quantity-controls button,
        .remove-button,
        .summary-button {
            border: 1px solid #c3d5e0;
            border-radius: 8px;
            background: #f3f8fa;
            cursor: pointer;
            min-width: 34px;
            min-height: 34px;
            font-weight: 800;
        }

        .remove-button {
            color: #8a1f1f;
        }

        .cart-summary-card {
            padding: 1rem;
            display: grid;
            gap: 0.85rem;
        }

        .cart-summary-card h2 {
            margin: 0;
            color: var(--geberit-dark);
            font-size: 1.2rem;
        }

        .discount-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 0.5rem;
        }

        .discount-row input {
            border: 1px solid #c3d5e0;
            border-radius: 10px;
            padding: 0.6rem 0.75rem;
            font: inherit;
        }

        .summary-button.primary {
            background: linear-gradient(90deg, #3f6f8f 0%, #2f3f47 100%);
            color: #fff;
            border: 0;
            padding: 0.7rem 1rem;
        }

        .summary-line {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
        }

        .summary-line.total {
            border-top: 1px solid #e4edf2;
            padding-top: 0.75rem;
            font-size: 1.1rem;
            font-weight: 900;
            color: var(--geberit-dark);
        }

        .empty-state {
            padding: 1.25rem;
            color: #64737a;
        }

        .note {
            margin: 0;
            color: #64737a;
            font-size: 0.86rem;
        }

        @media (max-width: 800px) {
            nav {
                flex-wrap: wrap;
            }

            .logo {
                width: 100%;
                margin-bottom: 0.5rem;
            }

            nav > a {
                margin-left: 0;
                margin-right: 18px;
            }

            .cart-layout {
                grid-template-columns: 1fr;
            }

            .cart-item {
                grid-template-columns: 78px 1fr;
            }

            .remove-button {
                grid-column: 2;
                width: max-content;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">
            <a href="Grundseite.html#home">
                <img src="../02_images/geberit-logo.png" alt="Geberit Logo">
            </a>
        </div>
        <a href="Grundseite.html">Home</a>
        <a href="Über-Uns.html">Über Geberit</a>
        <a href="produkte.html">Produkte</a>
        <a href="warenkorb.html" class="active">Warenkorb</a>
        <a href="Grundseite.html#contact">Kontakt</a>
    </nav>

    <main>
        <div class="page-head">
            <h1>Warenkorb</h1>
            <p>Produkte können nur über die Produktseite hinzugefügt werden.</p>
        </div>

        <div class="cart-layout">
            <section class="cart-list" id="cartList" aria-label="Warenkorb-Produkte"></section>

            <aside class="cart-summary-card">
                <h2>Zusammenfassung</h2>
                <div class="discount-row">
                    <input id="discountCode" type="text" placeholder="Rabattcode" autocomplete="off">
                    <button class="summary-button" id="applyDiscount" type="button">OK</button>
                </div>
                <div class="summary-line">
                    <span>Zwischensumme</span>
                    <strong id="subtotalValue">0,00 €</strong>
                </div>
                <div class="summary-line">
                    <span>Rabatt</span>
                    <strong id="discountValue">0%</strong>
                </div>
                <div class="summary-line total">
                    <span>Gesamt</span>
                    <strong id="totalValue">0,00 €</strong>
                </div>
                <button class="summary-button primary" id="clearCart" type="button">Warenkorb leeren</button>
                <p class="note">Gespeichert wird über IP-Adresse und Browser-ID. Rabattcodes: GEBERIT10, SCHULE15, PRAKTIKUM20.</p>
            </aside>
        </div>
    </main>

    <script src="../04_Datenbank/db-config.js"></script>
    <script>
        const visitorStorageKey = 'geberitVisitorId';
        const cartStorageKey = 'geberitCartItems';
        const discountStorageKey = 'geberitDiscountCode';

        const dom = {
            cartList: document.getElementById('cartList'),
            discountCode: document.getElementById('discountCode'),
            applyDiscount: document.getElementById('applyDiscount'),
            subtotalValue: document.getElementById('subtotalValue'),
            discountValue: document.getElementById('discountValue'),
            totalValue: document.getElementById('totalValue'),
            clearCart: document.getElementById('clearCart')
        };

        function getVisitorId() {
            let visitorId = localStorage.getItem(visitorStorageKey);
            if (!visitorId) {
                visitorId = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
                localStorage.setItem(visitorStorageKey, visitorId);
            }
            return visitorId;
        }

        function getCartItems() {
            try {
                return JSON.parse(localStorage.getItem(cartStorageKey)) || [];
            } catch (error) {
                return [];
            }
        }

        function setCartItems(items) {
            localStorage.setItem(cartStorageKey, JSON.stringify(items));
        }

        function getDiscountCode() {
            return localStorage.getItem(discountStorageKey) || '';
        }

        function setDiscountCode(code) {
            localStorage.setItem(discountStorageKey, code.trim().toUpperCase());
        }

        function parsePriceValue(priceText) {
            const normalized = String(priceText || '')
                .replace(/\./g, '')
                .replace(',', '.')
                .replace(/[^\d.]/g, '');
            const value = Number.parseFloat(normalized);
            return Number.isFinite(value) ? value : 0;
        }

        function getDiscountPercent(code) {
            const normalizedCode = code.trim().toUpperCase();
            if (normalizedCode === 'GEBERIT10') return 10;
            if (normalizedCode === 'SCHULE15') return 15;
            if (normalizedCode === 'PRAKTIKUM20') return 20;
            return 0;
        }

        function formatCurrency(value) {
            return value.toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
        }

        function syncCartItem(item) {
            GeberitDatabase.saveCartItem({
                visitor_id: getVisitorId(),
                product_name: item.name,
                category: item.category,
                price: item.price,
                image_url: item.image,
                quantity: item.quantity,
                discount_code: getDiscountCode() || null
            }).catch(error => console.warn('Warenkorb konnte nicht synchronisiert werden.', error));
        }

        function removeCartItemFromDatabase(productName) {
            GeberitDatabase.removeCartItem(getVisitorId(), productName)
                .catch(error => console.warn('Warenkorb-Eintrag konnte nicht gelöscht werden.', error));
        }

        function renderCart() {
            const items = getCartItems();
            const discountCode = getDiscountCode();
            const discountPercent = getDiscountPercent(discountCode);
            const subtotal = items.reduce((sum, item) => sum + parsePriceValue(item.price) * item.quantity, 0);
            const total = subtotal * (1 - discountPercent / 100);

            dom.discountCode.value = discountCode;
            dom.subtotalValue.textContent = formatCurrency(subtotal);
            dom.discountValue.textContent = discountPercent ? `${discountPercent}%` : '0%';
            dom.totalValue.textContent = formatCurrency(total);

            dom.cartList.innerHTML = items.length === 0
                ? '<p class="empty-state">Dein Warenkorb ist leer.</p>'
                : items.map(item => `
                    <article class="cart-item">
                        <img src="${item.image}" alt="">
                        <div>
                            <h2>${item.name}</h2>
                            <p>${item.category || 'Produkt'}</p>
                            <p><strong>${item.price || 'Preis nicht angegeben'}</strong></p>
                            <div class="quantity-controls">
                                <button type="button" data-action="decrease" data-product="${encodeURIComponent(item.name)}">−</button>
                                <span>${item.quantity}</span>
                                <button type="button" data-action="increase" data-product="${encodeURIComponent(item.name)}">+</button>
                            </div>
                        </div>
                        <button class="remove-button" type="button" data-action="remove" data-product="${encodeURIComponent(item.name)}">×</button>
                    </article>
                `).join('');
        }

        function updateItem(productName, change) {
            const items = getCartItems();
            const item = items.find(entry => entry.name === productName);
            if (!item) return;

            item.quantity += change;
            const nextItems = items.filter(entry => entry.quantity > 0);
            setCartItems(nextItems);

            if (item.quantity > 0) {
                syncCartItem(item);
            } else {
                removeCartItemFromDatabase(productName);
            }

            renderCart();
        }

        function removeItem(productName) {
            setCartItems(getCartItems().filter(item => item.name !== productName));
            removeCartItemFromDatabase(productName);
            renderCart();
        }

        async function loadSavedCart() {
            try {
                const savedItems = await GeberitDatabase.loadCartItems(getVisitorId());
                if (savedItems.length > 0) {
                    setCartItems(savedItems.map(item => ({
                        name: item.product_name,
                        category: item.category,
                        price: item.price,
                        image: item.image_url,
                        quantity: item.quantity || 1
                    })));
                }
            } catch (error) {
                console.warn('Gespeicherter Warenkorb konnte nicht geladen werden.', error);
            }
            renderCart();
        }

        dom.cartList.addEventListener('click', event => {
            const button = event.target.closest('[data-action]');
            if (!button) return;

            const productName = decodeURIComponent(button.dataset.product);
            if (button.dataset.action === 'increase') updateItem(productName, 1);
            if (button.dataset.action === 'decrease') updateItem(productName, -1);
            if (button.dataset.action === 'remove') removeItem(productName);
        });

        dom.applyDiscount.addEventListener('click', () => {
            setDiscountCode(dom.discountCode.value);
            getCartItems().forEach(syncCartItem);
            renderCart();
        });

        dom.clearCart.addEventListener('click', () => {
            setCartItems([]);
            GeberitDatabase.clearCartItems(getVisitorId())
                .catch(error => console.warn('Warenkorb konnte nicht geleert werden.', error));
            renderCart();
        });

        loadSavedCart();
    </script>
</body>
</html>
