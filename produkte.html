<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produkte - GeberitProdukte</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 1rem;
            text-align: center;
        }
        nav {
            background-color: #555;
            padding: 0.5rem;
        }
        nav a {
            color: #fff;
            margin: 0 1rem;
            text-decoration: none;
        }
        nav a:hover {
            text-decoration: underline;
        }
        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            background-color: #fff;
            padding: 2rem;
            border-radius: 5px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }
        .product-card {
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 1.5rem;
            background-color: #f9f9f9;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .product-card:hover {
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .product-card h3 {
            margin-top: 0;
            color: #333;
        }
        .product-card p {
            color: #666;
            margin-bottom: 1rem;
        }

        footer {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 1rem;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Unsere Produkte</h1>
    </header>

    <nav>
        <a href="Grundseite.html">Home</a>
        <a href="Grundseite.html#about">Über Geberit</a>
        <a href="produkte.html">Produkte</a>
        <a href="Grundseite.html#contact">Kontakt</a>
    </nav>

    <main>
        <h2>Geberit Produkte</h2>
        <p>Hier finden Sie alle unsere Produkte. </p>

        <div class="products-grid" id="productsContainer">
            <div class="product-card">
                <h3>Beispielprodukt 1</h3>
                <p>Beschreibung des Produkts 1</p>
                <p><strong>Preis:</strong> €</p>
            </div>
            <div class="product-card">
                <h3>Beispielprodukt 2</h3>
                <p>Beschreibung des Produkts 2</p>
                <p><strong>Preis:</strong> €</p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 GeberitProdukte. Alle Rechte vorbehalten.</p>
    </footer>


</body>
</html>
